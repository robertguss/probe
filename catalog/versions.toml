# catalog/versions.toml — single machine-readable lock manifest (Section 33.4 / REQ-090)
#
# Authority:
#   - Human-readable normative table: Section 12 of
#     docs/02-definitive-foundry-specification-revised-fable-5.md
#   - This file is the single lock: every dependency version, tool version,
#     Go toolchain pin, and third-party GitHub Action full commit SHA (with
#     human-readable tag) consumed by Foundry or generated projects.
#
# Policy:
#   - Exact pins only (no ranges, no "latest", no floating tags).
#   - Actions are pinned by full 40-char commit SHA; tag is recorded alongside.
#   - Catalog validation (internal/catalog, bead wkz) MUST fail when a lock
#     entry is consumed zero times or when any version/action appears in
#     rendered output without a corresponding lock entry.
#   - Pin changes require a catalog-bearing Foundry release + golden regen.
#   - Evidence: docs/evidence/E5-version-action-lock.md (2026-07-30).
#
# schema: stable key layout for Phase 1 embed/validation; additive fields only.

schema = 1
locked_at = "2026-07-30"
evidence = "docs/evidence/E5-version-action-lock.md"

[toolchain]
# Go language/toolchain pin (Section 12.1 / 12.2). Exact minor.
# Includes CVE-2026-39822 (os.Root trailing-slash symlink escape) fix.

# CLI archetype — conventional Cobra CLI project (Section 17.2, REQ-060–067).
# Minimal working shell only: root help, version, hidden completion.
# No greet/demo domain service (FND-014). Core files live in core/ (P2.6.b).
schema = 1
id = "cli"
kind = "archetype"
description = "Conventional CLI project archetype (Cobra command tree)"

# --- cmd/<binary>/ ---
[[files]]
path = "cmd/{{binary}}/main.go"
render = "template"
source = "files/main.go.tmpl"
mode = "0644"

# --- internal/cli/ (Cobra confined here; Section 17.4) ---
[[files]]
path = "internal/cli/root.go"
render = "template"
source = "files/internal/cli/root.go.tmpl"
mode = "0644"

[[files]]
path = "internal/cli/root_test.go"
render = "template"
source = "files/internal/cli/root_test.go.tmpl"
mode = "0644"

[[files]]
path = "internal/cli/version.go"
render = "template"
source = "files/internal/cli/version.go.tmpl"
mode = "0644"

[[files]]
path = "internal/cli/completion.go"
render = "static"
source = "files/internal/cli/completion.go.static"
mode = "0644"

[[files]]
path = "internal/cli/script_test.go"
render = "template"
source = "files/internal/cli/script_test.go.tmpl"
mode = "0644"

# --- internal/cli/testdata/script/ (testscript process tests) ---
[[files]]
path = "internal/cli/testdata/script/help.txt"
render = "template"
source = "files/internal/cli/testdata/script/help.txt.tmpl"
mode = "0644"

[[files]]
path = "internal/cli/testdata/script/version.txt"
render = "template"
source = "files/internal/cli/testdata/script/version.txt.tmpl"
mode = "0644"

[[files]]
path = "internal/cli/testdata/script/completion.txt"
render = "template"
source = "files/internal/cli/testdata/script/completion.txt.tmpl"
mode = "0644"

# --- dependencies (lock-pinned via catalog/versions.toml) ---
[[dependencies]]
module = "github.com/spf13/cobra"
version = "v1.10.2"
scope = "runtime"

[[dependencies]]
module = "github.com/rogpeppe/go-internal"
version = "v1.15.0"
scope = "test"

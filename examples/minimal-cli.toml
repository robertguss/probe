# Minimal private CLI — fully valid Project Spec (SPEC-FOUNDRY-002 Appendix B shape).
# Copy, then edit name / module / destination (basename MUST equal name).
# Or scaffold with: foundry init --out ./my.toml --name … --module …
schema = 1
name = "minimal-cli"
module = "github.com/example/minimal-cli"
description = "Minimal Foundry CLI example for validate, plan, and generate"
archetype = "cli"
destination = "./minimal-cli"
# Empty profiles is the default private CLI. The only selectable optional
# profile today is "distribution" (requires visibility=public and a
# github.com/<owner>/<name> module — see appendix-b-public-cli.toml).
profiles = []

# Optional performance baseline capture (Section 49 / REQ-165).
# NOT a required PR gate — no absolute thresholds until multi-machine history
# exists (bead go-foundry-cli-j8h.1). Manual / scheduled only.
#
# Action pins match catalog/versions.toml (REQ-224). Full commit SHAs only.

name: perf-baselines

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Fewer iterations (--quick)"
        type: boolean
        default: true
      skip_cold:
        description: "Skip cleared GOMODCACHE/GOCACHE generate"
        type: boolean
        default: false
  # Baselines are also captured on every main push so perf-regression can
  # download an up-to-date reference artifact.
  push:
    branches: [main, master]
  # Weekly observation only; failures must not block merges (not in required checks).
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  capture:
    name: linux-perf-baselines
    runs-on: ubuntu-latest
    # Soft job: never fail the workflow for timing variance (no absolute gates).
    continue-on-error: true
    env:
      CGO_ENABLED: "0"
      # Golden discipline (REQ-219): CI indicator refuses golden auto-updates.
      CI: "true"
      MACHINE_CLASS: ci-github
      FOUNDRY_PERF_OUT: ${{ github.workspace }}/artifacts/perf
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        # actions/setup-go v6.5.0 — toolchain from go.mod (1.26.5)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare output directory
        run: mkdir -p "${FOUNDRY_PERF_OUT}"

      - name: Capture baselines (no absolute gate)
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.quick }}" == "true" ]]; then
              args+=(--quick)
            fi
            if [[ "${{ inputs.skip_cold }}" == "true" ]]; then
              args+=(--skip-cold)
            fi
          else
            # Scheduled: quick warm + one cold for observation, not flake gates.
            args+=(--quick)
          fi
          chmod +x ./scripts/perf/capture-baselines.sh
          ./scripts/perf/capture-baselines.sh "${args[@]+"${args[@]}"}"
          echo "--- summary ---"
          cat "${FOUNDRY_PERF_OUT}/summary.md" || true

      - name: Schema smoke (format only)
        run: |
          set -euo pipefail
          go test -count=1 ./internal/archtest/ -run 'TestPerfBaselineSchema' -v

      - name: Upload perf artifacts
        if: always()
        # actions/upload-artifact v5.0.0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-baselines
          path: artifacts/perf/
          if-no-files-found: warn

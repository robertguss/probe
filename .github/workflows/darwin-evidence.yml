# Darwin live evidence legs (go-foundry-cli-962 E1 APFS, o60.1 E3 race).
# Alternate to owner Tailscale Mac: GitHub-hosted macos-latest (APFS + Xcode CLT).
# Action pins from catalog/versions.toml (REQ-224).
name: darwin-evidence

on:
  workflow_dispatch:
  # Also allow manual re-run after Mac offline blocks.
  push:
    paths:
      - "integration/hostile/e1/**"
      - "integration/hostile/e3/**"
      - ".github/workflows/darwin-evidence.yml"
      - "docs/evidence/E1-descriptor-relative-transaction.md"
      - "docs/evidence/E3-race-prerequisites.md"

permissions:
  contents: read

concurrency:
  group: darwin-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e1-apfs:
    name: macos-e1-apfs
    runs-on: macos-latest
    env:
      CI: "true"
      GOTOOLCHAIN: go1.26.5
      E1_LOG_DIR: ${{ github.workspace }}/docs/evidence/e1-logs
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: E1 Darwin/APFS harness
        run: |
          set -euo pipefail
          chmod +x ./integration/hostile/e1/scripts/e1-darwin-apfs.sh
          ./integration/hostile/e1/scripts/e1-darwin-apfs.sh

      - name: Upload E1 Darwin logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e1-darwin-apfs-logs
          path: docs/evidence/e1-logs/
          if-no-files-found: warn

  e3-race:
    name: macos-e3-race
    runs-on: macos-latest
    env:
      CI: "true"
      GOTOOLCHAIN: go1.26.5
      E3_LOG_DIR: ${{ github.workspace }}/docs/evidence/e3-logs/darwin
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: E3 Darwin race harness
        run: |
          set -euo pipefail
          chmod +x ./integration/hostile/e3/scripts/e3-darwin-race.sh
          ./integration/hostile/e3/scripts/e3-darwin-race.sh

      - name: Upload E3 Darwin logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e3-darwin-race-logs
          path: docs/evidence/e3-logs/darwin/
          if-no-files-found: warn

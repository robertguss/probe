# Flaky-test detection for long / slow suites (bead go-foundry-cli-wet.5.6 /
# go-foundry-cli-ipk.17).
# This workflow is intentionally non-blocking (continue-on-error: true) while
# the baseline is being stabilized. It runs selected suites with -count=5, parses
# the go-test JSON streams, and flags tests that fail intermittently or have
# high duration variance.
#
# Artifact: flaky-detection-report (JSON go-test outputs + summary text/JSON).
# Policy (ipk.17): when a test is flagged, open a bead naming package/test and
# link this run's artifact; do not raise e2e retry counts to hide flakes.
# Generate-e2e/dogfood 3-attempt retries must keep artifacts; file a bead if
# the same test needs retries twice in 7 days.

name: flaky-detection

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Do not cancel superseded runs; we want every scheduled detection pass.
concurrency:
  group: foundry-flaky-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  flaky:
    name: flaky-detection
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    env:
      CGO_ENABLED: "0"
      CI: "true"
      FOUNDRY_FLAKY_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/flaky
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        # actions/setup-go v6.5.0 — toolchain from go.mod (1.26.5)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare artifact directory
        run: mkdir -p "$FOUNDRY_FLAKY_ARTIFACT_DIR"

      - name: Detect flaky tests
        run: ./scripts/flaky-detect.sh

      - name: Upload flaky detection report
        if: always()
        # actions/upload-artifact v5.0.0
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: flaky-detection-report
          path: artifacts/flaky/
          if-no-files-found: warn
          retention-days: 14

      - name: Flaky detection summary
        if: always()
        run: |
          echo '## Flaky detection artifacts' >> "$GITHUB_STEP_SUMMARY"
          echo '- artifacts/flaky/ (uploaded as flaky-detection-report)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Policy (ipk.17): file a bead for any newly flagged test; link this artifact' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$FOUNDRY_FLAKY_ARTIFACT_DIR/summary.txt" ]; then
            echo '### summary.txt' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -n 80 "$FOUNDRY_FLAKY_ARTIFACT_DIR/summary.txt" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

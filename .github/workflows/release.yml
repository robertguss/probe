# Foundry self-release (Section 48 / 1wl). Tag-triggered only.
# Action pins from catalog/versions.toml (REQ-224).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      CI: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: License gate
        run: |
          if [ ! -f LICENSE ] && [ ! -f LICENSE.md ]; then
            echo "Add LICENSE before public release (FND-019)."
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

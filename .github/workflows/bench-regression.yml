# Microbenchmark regression gate (bead go-foundry-cli-wet.5.7).
#
# Runs the hot-path benchmarks in internal/spec, internal/resolve, internal/plan,
# and internal/render with -count=5, compares the current median ns/op against
# the stored baseline in docs/evidence/perf/microbench-baseline.json, and fails
# when the median regresses by more than FOUNDRY_BENCH_REGRESSION_THRESHOLD.
#
# The baseline is stored in git; update it intentionally with:
#   python3 scripts/perf/bench-capture.py 5 200ms > docs/evidence/perf/microbench-baseline.json
# after a performance improvement has been verified.

name: bench-regression

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs of the same ref.
concurrency:
  group: foundry-bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: bench-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
      CI: "true"
      FOUNDRY_BENCH_REGRESSION_THRESHOLD: "0.20"
      FOUNDRY_BENCH_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/bench
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        # actions/setup-go v6.5.0 — toolchain from go.mod (1.26.5)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare artifact directory
        run: mkdir -p "$FOUNDRY_BENCH_ARTIFACT_DIR"

      - name: Run benchmarks
        run: |
          set -uo pipefail
          python3 scripts/perf/bench-capture.py 5 200ms > "$FOUNDRY_BENCH_ARTIFACT_DIR/current.json"

      - name: Compare against baseline
        run: |
          set -uo pipefail
          python3 scripts/perf/bench-compare.py docs/evidence/perf/microbench-baseline.json "$FOUNDRY_BENCH_ARTIFACT_DIR/current.json" | tee "$FOUNDRY_BENCH_ARTIFACT_DIR/report.txt"

      - name: Upload benchmark artifacts
        if: always()
        # actions/upload-artifact v5.0.0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-regression-report
          path: artifacts/bench/
          if-no-files-found: warn
          retention-days: 14

      - name: Benchmark summary
        if: always()
        run: |
          echo '## Benchmark regression artifacts' >> "$GITHUB_STEP_SUMMARY"
          echo '- artifacts/bench/current.json and report.txt (uploaded as bench-regression-report)' >> "$GITHUB_STEP_SUMMARY"

# Foundry repository strict workflow (Section 47.1 / bead go-foundry-cli-cic).
# Weekly + manual only — not a required PR gate.
# govulncheck, bounded fuzz, cold-cache timing baseline, full hostile suite.
#
# Action pins from catalog/versions.toml (REQ-224). Full commit SHAs only.
# Never enable golden auto-update env vars. Always set CI=true (REQ-219).

name: strict

on:
  schedule:
    # Weekly Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: linux-govulncheck
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      CI: "true"
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        # actions/setup-go v6.5.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go tool govulncheck ./...

  fuzz:
    name: linux-bounded-fuzz
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      CI: "true"
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        # actions/setup-go v6.5.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Bounded fuzz (when targets exist)
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./... 2>/dev/null || true)
          found=0
          for pkg in "${pkgs[@]+"${pkgs[@]}"}"; do
            while IFS= read -r name; do
              case "$name" in
                Fuzz*)
                  found=1
                  echo "fuzz: $pkg $name"
                  go test -count=1 "$pkg" -run='^$' -fuzz="^${name}$" -fuzztime=10s
                  ;;
              esac
            done < <(go test -count=1 -list '^Fuzz' "$pkg" 2>/dev/null || true)
          done
          if [ "$found" -eq 0 ]; then
            echo "fuzz: no Fuzz* targets found; skipping"
          fi

  # Cold-cache generation timing baseline (Section 47.1 / 49).
  cold-cache-baseline:
    name: linux-cold-cache-baseline
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      CI: "true"
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        # actions/setup-go v6.5.0 — disable module cache for cold path
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cold-cache plan/generate unit path
        run: |
          set -euo pipefail
          # Timing baseline for pure plan (no network) + catalog load.
          /usr/bin/time -f 'plan_cli_elapsed_sec=%e' go test -count=1 ./internal/plan/ -run TestGoldenPlans
          /usr/bin/time -f 'catalog_elapsed_sec=%e' go test -count=1 ./internal/catalog/ -run TestCatalogDigestStable
          /usr/bin/time -f 'cli_surface_elapsed_sec=%e' go test -count=1 ./internal/cli/ -run 'TestPlanJSON|TestVersion'

  # Full hostile suite on a weekly cadence (beyond PR hostile-fsx/sentinel).
  hostile-full:
    name: linux-hostile-full
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      CI: "true"
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        # actions/setup-go v6.5.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Full hostile packages
        run: |
          set -euo pipefail
          go test -count=1 -timeout 10m ./integration/hostile/...
          go test -tags=hostile -count=1 -timeout 5m ./integration/hostile/fsx/ ./internal/fsx/

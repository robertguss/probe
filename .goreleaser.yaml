version: 2
project_name: foundry
builds:
  - id: foundry
    main: ./cmd/foundry
    binary: foundry
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/robertguss/go-foundry-cli/internal/version.Version={{.Version}}
      - -X github.com/robertguss/go-foundry-cli/internal/version.Commit={{.FullCommit}}
archives:
  - formats: [tar.gz]
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
snapshot:
  version_template: "{{ incpatch .Version }}-next"
